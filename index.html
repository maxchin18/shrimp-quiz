<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蝦君的學習旅程 — 闖關大冒險</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #00b4d8 0%, #0077b6 50%, #023e8a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 28px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
            max-width: 880px;
            width: 100%;
            overflow: hidden;
            position: relative;
            z-index: 2;
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24, #ff9f43);
            background-size: 200% 200%;
            animation: gradientShift 6s ease infinite;
            color: white;
            padding: 28px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .header::before {
            content: "🦐";
            position: absolute;
            font-size: 140px;
            opacity: 0.18;
            right: -10px;
            top: -20px;
            transform: rotate(-15deg);
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 6px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.25);
            letter-spacing: 1px;
        }

        .header .subtitle {
            font-size: 1.05em;
            opacity: 0.95;
        }

        .header .school {
            font-size: 0.85em;
            margin-top: 6px;
            opacity: 0.88;
            font-weight: 300;
        }

        .progress-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 22px 24px;
            background: linear-gradient(180deg, #fff8e1, #fff3cd);
            border-bottom: 3px solid #ffd54f;
            flex-wrap: wrap;
        }

        .progress-dot {
            min-width: 60px;
            height: 60px;
            padding: 6px 8px;
            border-radius: 16px;
            background: #fff;
            border: 3px solid #dee2e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #868e96;
            font-size: 0.78em;
            transition: all 0.4s;
            position: relative;
            line-height: 1.1;
            text-align: center;
        }

        .progress-dot .dot-num {
            font-size: 1.35em;
        }

        .progress-dot .dot-emoji {
            font-size: 1.2em;
            margin-bottom: 2px;
        }

        .progress-dot.active {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-color: #c0392b;
            color: white;
            transform: scale(1.12) translateY(-4px);
            box-shadow: 0 8px 22px rgba(255, 107, 107, 0.5);
        }

        .progress-dot.completed {
            background: linear-gradient(135deg, #51cf66, #2b8a3e);
            border-color: #1e6b2e;
            color: white;
        }

        .progress-dot.failed {
            background: linear-gradient(135deg, #ffa8a8, #ff8787);
            border-color: #c92a2a;
            color: white;
        }

        .content {
            padding: 32px;
            min-height: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .shrimp-image {
            font-size: 110px;
            margin-bottom: 12px;
            animation: bounce 2.2s ease-in-out infinite;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.2));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-14px) rotate(3deg); }
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        .question-area {
            width: 100%;
            text-align: center;
        }

        .level-title {
            display: inline-block;
            font-size: 1.15em;
            color: white;
            background: linear-gradient(135deg, #f06595, #cc5de8);
            font-weight: bold;
            padding: 6px 18px;
            border-radius: 20px;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(204, 93, 232, 0.4);
        }

        .level-subtitle {
            font-size: 1.6em;
            color: #495057;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .level-strategy {
            font-size: 0.9em;
            color: #868e96;
            margin-bottom: 16px;
            font-style: italic;
        }

        .question {
            font-size: 1.35em;
            font-weight: bold;
            color: #212529;
            margin-bottom: 8px;
            line-height: 1.6;
            padding: 0 8px;
        }

        .shrimp-info {
            background: linear-gradient(135deg, #fff9db, #fff3bf);
            border-radius: 18px;
            padding: 20px 24px;
            margin-bottom: 22px;
            text-align: left;
            line-height: 1.85;
            font-size: 0.95em;
            color: #343a40;
            border: 3px solid #ffe066;
            box-shadow: 0 4px 14px rgba(255, 224, 102, 0.25);
        }

        .shrimp-info h3 {
            color: #e67700;
            margin-bottom: 10px;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 2px dashed #ffd43b;
            padding-bottom: 6px;
        }

        .info-item {
            display: flex;
            gap: 8px;
            margin-bottom: 4px;
        }

        .info-item::before {
            content: "🌟";
            flex-shrink: 0;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            width: 100%;
            margin-top: 18px;
        }

        .option-btn {
            padding: 18px 22px;
            border: 3px solid #dee2e6;
            border-radius: 16px;
            background: white;
            font-size: 1.05em;
            cursor: pointer;
            transition: all 0.3s;
            color: #343a40;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }

        .option-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #339af0;
            background: linear-gradient(135deg, #e7f5ff, #d0ebff);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 6px 18px rgba(51, 154, 240, 0.25);
        }

        .option-btn:hover:not(:disabled)::before {
            left: 100%;
        }

        .option-btn.correct {
            border-color: #51cf66;
            background: linear-gradient(135deg, #d3f9d8, #b2f2bb);
            color: #2b8a3e;
            font-weight: bold;
            animation: correctPulse 0.6s;
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        .option-btn.wrong {
            border-color: #ff6b6b;
            background: linear-gradient(135deg, #ffe3e3, #ffc9c9);
            color: #c92a2a;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.85;
        }

        .feedback {
            margin-top: 22px;
            padding: 18px 26px;
            border-radius: 16px;
            font-size: 1.05em;
            font-weight: 600;
            text-align: center;
            animation: fadeIn 0.4s;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background: linear-gradient(135deg, #d3f9d8, #b2f2bb);
            color: #2b8a3e;
            border: 3px solid #69db7c;
            box-shadow: 0 4px 14px rgba(105, 219, 124, 0.3);
        }

        .feedback.wrong {
            background: linear-gradient(135deg, #ffe3e3, #ffc9c9);
            color: #c92a2a;
            border: 3px solid #ff8787;
            box-shadow: 0 4px 14px rgba(255, 135, 135, 0.3);
        }

        .next-btn {
            margin-top: 22px;
            padding: 16px 44px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.15em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 14px rgba(238, 90, 36, 0.35);
            letter-spacing: 1px;
        }

        .next-btn:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 8px 25px rgba(238, 90, 36, 0.5);
        }

        .start-screen, .result-screen {
            text-align: center;
            padding: 12px 0;
        }

        .start-screen h2 {
            font-size: 1.8em;
            color: #212529;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #f06595, #cc5de8, #5c7cfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .start-screen p {
            color: #495057;
            font-size: 1.05em;
            line-height: 1.9;
            margin-bottom: 22px;
        }

        .stage-preview {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 20px 0 28px;
        }

        .stage-card {
            background: linear-gradient(135deg, #e7f5ff, #d0ebff);
            border: 2px solid #74c0fc;
            border-radius: 14px;
            padding: 12px 6px;
            text-align: center;
            font-size: 0.78em;
            color: #1971c2;
            font-weight: 600;
            transition: all 0.3s;
        }

        .stage-card:hover {
            transform: translateY(-4px) rotate(-2deg);
            box-shadow: 0 6px 16px rgba(116, 192, 252, 0.4);
        }

        .stage-card .stage-emoji {
            font-size: 2em;
            display: block;
            margin-bottom: 4px;
        }

        .start-btn {
            padding: 18px 52px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24, #ff9f43);
            background-size: 200% 200%;
            animation: gradientShift 4s ease infinite;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(238, 90, 36, 0.45);
            letter-spacing: 2px;
        }

        .start-btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 10px 28px rgba(238, 90, 36, 0.55);
        }

        .result-screen h2 {
            font-size: 2em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #f06595, #cc5de8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score-display {
            font-size: 4em;
            font-weight: bold;
            margin: 12px 0;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.15);
        }

        .score-display.perfect {
            background: linear-gradient(135deg, #f59f00, #ff922b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: wiggle 1s infinite;
        }
        .score-display.great { color: #51cf66; }
        .score-display.ok { color: #339af0; }
        .score-display.low { color: #ff6b6b; }

        .grade-badge {
            display: inline-block;
            font-size: 1.5em;
            font-weight: bold;
            color: white;
            padding: 8px 28px;
            border-radius: 30px;
            background: linear-gradient(135deg, #f06595, #cc5de8);
            margin-bottom: 12px;
            box-shadow: 0 6px 18px rgba(204, 93, 232, 0.4);
        }

        .result-message {
            font-size: 1.1em;
            color: #495057;
            margin-bottom: 24px;
            line-height: 1.7;
        }

        .stars {
            font-size: 2.8em;
            margin-bottom: 12px;
            letter-spacing: 6px;
            animation: wiggle 1.5s ease-in-out infinite;
        }

        .bubbles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6), rgba(255,255,255,0.1));
            border-radius: 50%;
            animation: rise linear infinite;
        }

        @keyframes rise {
            to { transform: translateY(-110vh) translateX(40px) rotate(360deg); opacity: 0; }
        }

        .floating-shrimp {
            position: fixed;
            font-size: 32px;
            opacity: 0.25;
            pointer-events: none;
            z-index: 1;
            animation: floatAcross linear infinite;
        }

        @keyframes floatAcross {
            from { transform: translateX(-100px) rotate(0deg); }
            to { transform: translateX(calc(100vw + 100px)) rotate(20deg); }
        }

        .badge-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .badge {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 0.78em;
            color: #868e96;
            font-weight: 600;
        }

        .badge.earned {
            background: linear-gradient(135deg, #fff3bf, #ffd43b);
            border-color: #fab005;
            color: #663700;
            box-shadow: 0 3px 10px rgba(250, 176, 5, 0.3);
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.6em; }
            .options { grid-template-columns: 1fr; }
            .content { padding: 22px; }
            .shrimp-image { font-size: 80px; }
            .question { font-size: 1.15em; }
            .stage-preview { grid-template-columns: repeat(2, 1fr); }
            .progress-dot { min-width: 52px; height: 52px; font-size: 0.7em; }
            .score-display { font-size: 3em; }
        }
    </style>
</head>
<body>
    <div class="bubbles" id="bubbles"></div>
    <div class="container">
        <div class="header">
            <h1>🦐 蝦君的學習旅程 🦐</h1>
            <div class="subtitle">食農 × 數位 × AI 闖關大冒險</div>
            <div class="school">臺南市安南區土城國民小學・國小高年級</div>
        </div>
        <div class="progress-bar" id="progressBar"></div>
        <div class="content" id="content"></div>
    </div>

    <script>
        // 五個關卡對應教案五節課程
        const levels = [
            {

            {
                stage: "第 2 關",

                emoji: "🦐",
                info: {
                    name: "蝦的身體構造大解密",
                    details: [
                        "蝦的身體分為三大部分：「頭部」、「胸部」、「腹部」。",
                        "頭部：有 2 對觸角、複眼、口器，用來感知環境。",
                        "胸部：有 5 對步足，幫助蝦在水中爬行與抓食物。",
                        "腹部：有 6 對腹肢與一個尾扇，是蝦快速游泳的關鍵。",
                        "判斷蝦的新鮮度可從「顏色」「氣味」「彈性」三方向來檢查。",

                explain_correct: "完全正確！蝦的胸部有 5 對步足，下次吃蝦時可以仔細觀察喔！",

            {

            {
                stage: "第 4 關",

                        "惜食精神：每一隻蝦都是蝦農凌晨 4:30 起床照顧出來的，要懂得感恩！"

                },
                question: "為什麼老師鼓勵大家選擇購買「在地當季」的蝦呢？",
                options: [
                    "因為比較貴所以好吃",
                    "因為可以集點換玩具",
                    "可以減少碳足跡並支持在地產業",
                    "因為比較好剝殼"
                ],
                answer: 2,
                explain_correct: "答對了！「地產地消」可以減少運輸的碳足跡，又能支持台南在地蝦農，是真正的綠色消費！",
                explain_wrong: "再想想～選擇在地當季的蝦最重要的原因是「減少碳足跡」並支持在地產業，這就是地產地消的精神！"
            },
            {
                stage: "第 5 關",
                title: "AI 蝦君大冒險",
                subtitle: "🤖 用 Gemini 設計互動遊戲",
                strategy: "★ 同質性分組｜★ 自學→導學→共學→互學",
                emoji: "🤖",
                info: {
                    name: "AI 是學習夥伴，不是替代品！",
                    details: [
                        "Gemini 是 Google 開發的生成式 AI，可以協助我們設計遊戲、寫故事、整理資料。",
                        "好的 Prompt（提示語）要包含：「對象」「主題」「題型」「數量」「難度」。",
                        "範例 Prompt：「請幫我設計給國小高年級的蝦類知識闖關 5 題，包含選擇題與是非題。」",
                        "使用 AI 的三大原則：✅ 標註來源、✅ 判讀真偽、✅ 創作責任。",
                        "AI 也可能會出錯！我們要審核、修改，再變成自己的作品。",
                        "完成作品要標註：「本作品使用 Gemini AI 協助設計，已由本組成員審核修改」。"
                    ]
                },
                question: "使用 Gemini 等生成式 AI 創作時，下列哪一個態度最正確？",
                options: [
                    "AI 答的全部直接複製貼上就好",
                    "AI 回答都是對的，不用查證",
                    "把 AI 當夥伴，審核、修改、標註來源",
                    "完全不要用 AI 才不會犯錯"
                ],
                answer: 2,
                explain_correct: "完美過關！AI 是學習夥伴不是替代品，要學會審核修改、標註來源，才是未來公民的重要素養！🎉",
                explain_wrong: "再想想喔！正確的 AI 使用態度是：把它當「學習夥伴」，回答後要自己審核修改，並且標註來源喔！"
            }
        ];

        let currentLevel = -1;
        let score = 0;
        let answered = false;

        function createBubbles() {
            const container = document.getElementById('bubbles');
            for (let i = 0; i < 18; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                const size = Math.random() * 70 + 20;
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';
                bubble.style.left = Math.random() * 100 + '%';
                bubble.style.animationDuration = (Math.random() * 8 + 8) + 's';
                bubble.style.animationDelay = (Math.random() * 6) + 's';
                container.appendChild(bubble);
            }
            // floating shrimp
            for (let i = 0; i < 3; i++) {
                const s = document.createElement('div');
                s.className = 'floating-shrimp';
                s.textContent = ['🦐','🐟','🦞'][i % 3];
                s.style.top = (10 + Math.random() * 70) + '%';
                s.style.animationDuration = (Math.random() * 25 + 25) + 's';
                s.style.animationDelay = (Math.random() * 10) + 's';
                document.body.appendChild(s);
            }
        }

        function updateProgress() {
            const bar = document.getElementById('progressBar');
            bar.innerHTML = '';
            for (let i = 0; i < levels.length; i++) {
                const dot = document.createElement('div');
                dot.className = 'progress-dot';
                if (i === currentLevel) dot.classList.add('active');
                else if (i < currentLevel) dot.classList.add('completed');
                dot.innerHTML = `<div class="dot-emoji">${levels[i].emoji}</div><div class="dot-num">${i + 1}</div>`;
                bar.appendChild(dot);
            }
        }

        function showStart() {
            document.getElementById('progressBar').style.display = 'none';
            const stagesHTML = levels.map((lv, i) => `
                <div class="stage-card">
                    <span class="stage-emoji">${lv.emoji}</span>
                    第 ${i + 1} 節<br>${lv.title}
                </div>
            `).join('');

            document.getElementById('content').innerHTML = `
                <div class="start-screen">
                    <div class="shrimp-image">🦐</div>
                    <h2>歡迎來到蝦君的學習旅程！</h2>
                    <p>
                        嗨！我是 <strong>蝦君</strong> 🦐<br>
                        想知道台南蝦農的辛勞、蝦的身體秘密、<br>
                        如何做出香噴噴的蝦手卷，<br>
                        甚至怎麼跟 AI 一起設計遊戲嗎？<br>
                        <br>
                        快跟我一起踏上 <strong>5 大關</strong> 的奇幻冒險吧！
                    </p>
                    <div class="stage-preview">${stagesHTML}</div>
                    <button class="start-btn" onclick="startGame()">🚀 開始闖關！</button>
                </div>
            `;
        }

        function startGame() {
            currentLevel = 0;
            score = 0;
            answered = false;
            document.getElementById('progressBar').style.display = 'flex';
            showLevel();
        }

        function showLevel() {
            answered = false;
            updateProgress();
            const level = levels[currentLevel];
            const infoHTML = level.info.details.map(d => `<div class="info-item">${d}</div>`).join('');

            document.getElementById('content').innerHTML = `
                <div class="question-area">
                    <div class="level-title">${level.stage}</div>
                    <div class="shrimp-image">${level.emoji}</div>
                    <div class="level-subtitle">${level.title}</div>
                    <div class="level-strategy">${level.subtitle}<br>${level.strategy}</div>
                    <div class="shrimp-info">
                        <h3>📖 ${level.info.name}</h3>
                        ${infoHTML}
                    </div>
                    <div class="question">❓ ${level.question}</div>
                    <div class="options" id="options">
                        ${level.options.map((opt, i) => `
                            <button class="option-btn" onclick="checkAnswer(${i})">${String.fromCharCode(65 + i)}. ${opt}</button>
                        `).join('')}
                    </div>
                    <div id="feedback"></div>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function checkAnswer(selected) {
            if (answered) return;
            answered = true;
            const level = levels[currentLevel];
            const buttons = document.querySelectorAll('.option-btn');
            const feedbackDiv = document.getElementById('feedback');

            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === level.answer) btn.classList.add('correct');
                if (i === selected && i !== level.answer) btn.classList.add('wrong');
            });

            const isLast = currentLevel === levels.length - 1;
            const nextText = isLast ? '🏆 查看闖關結果' : '➜ 前往下一關';

            if (selected === level.answer) {
                score++;
                feedbackDiv.innerHTML = `
                    <div class="feedback correct">✅ ${level.explain_correct}</div>
                    <button class="next-btn" onclick="nextLevel()">${nextText}</button>
                `;
            } else {
                feedbackDiv.innerHTML = `
                    <div class="feedback wrong">❌ ${level.explain_wrong}</div>
                    <button class="next-btn" onclick="nextLevel()">${nextText}</button>
                `;
            }

            const dots = document.querySelectorAll('.progress-dot');
            if (selected === level.answer) {
                dots[currentLevel].classList.add('completed');
            } else {
                dots[currentLevel].classList.add('failed');
            }
        }

        function nextLevel() {
            currentLevel++;
            if (currentLevel >= levels.length) {
                showResult();
            } else {
                showLevel();
            }
        }

        function showResult() {
            document.getElementById('progressBar').style.display = 'none';
            let grade, message, stars, scoreClass, emoji;

            if (score === 5) {
                grade = "蝦博士";
                emoji = "🏆";
                message = "太厲害了！你是真正的蝦類專家！<br>從養殖、構造、料理到 AI 應用全都答對！<br>蝦君都要來拜你為師了！🦐";
                stars = "⭐⭐⭐⭐⭐";
                scoreClass = "perfect";
            } else if (score >= 4) {
                grade = "蝦達人";
                emoji = "🥈";
                message = "非常優秀！你對蝦的世界有深入的了解！<br>再多複習一下教材，下次就能拿到滿分！";
                stars = "⭐⭐⭐⭐";
                scoreClass = "great";
            } else if (score >= 3) {
                grade = "蝦學徒";
                emoji = "🥉";
                message = "不錯的表現！你已經有蝦類的基本知識了。<br>再多看看教材內容，蝦達人在等著你！";
                stars = "⭐⭐⭐";
                scoreClass = "ok";
            } else {
                grade = "蝦新手";
                emoji = "🌱";
                message = "別氣餒！學習就像養蝦，需要時間慢慢累積～<br>再來挑戰一次，你一定會更厲害的！";
                stars = "⭐⭐";
                scoreClass = "low";
            }

            const badges = levels.map((lv, i) => {
                const earned = i < score; // simplified — we track via dots actually
                return `<div class="badge ${earned ? 'earned' : ''}">${lv.emoji} ${lv.title}</div>`;
            }).join('');

            document.getElementById('content').innerHTML = `
                <div class="result-screen">
                    <div class="shrimp-image">${emoji}</div>
                    <h2>闖關結束！</h2>
                    <div class="stars">${stars}</div>
                    <div class="score-display ${scoreClass}">${score} / ${levels.length}</div>
                    <div class="grade-badge">${grade}</div>
                    <div class="result-message">${message}</div>
                    <div class="badge-row">${badges}</div>
                    <button class="start-btn" onclick="startGame()">🔄 再玩一次</button>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        createBubbles();
        showStart();
    </script>
</body>
</html>
